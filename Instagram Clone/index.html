<html>
    <head>
        <link rel="stylesheet" href="index.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>

    <body>

        <header>
            <img id="logo" src="images/logo.png">
            <img id="user-avatar" src="images/user-avatar.png">
        </header>

        <div class="page" id="page"></div>

        <div id="post-template" style="display: none;">

            <div class="individual-post">

                <div class="post-title">
                    <img id="profile-img">

                    <div class="profile-name">
                        <h1 class="name"></h1>
                        <p class="place"></p>
                    </div>
                </div>

                <div>
                    <img id="post-img">
                </div>

                <div id="post-icons">
                    <img id="heart-icon" src="images/icon-heart.png">
                    <img id="comment-icon" src="images/icon-comment.png">
                    <img id="dm-icon" src="images/icon-dm.png">
                </div>

                <div id="post-info">
                    <h2 id="likes-amount"></h2>

                    <p>
                        <span id="username"></span>
                        <span class="comment"></span>
                    </p>
                </div>

            </div>

        </div>

        <script src="index.js"></script>

    </body>
</html>
